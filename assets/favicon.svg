<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="tw-clip"><rect width="64" height="64" rx="14.5"/></clipPath>
    <linearGradient id="tw-hue" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="0">
      <stop offset=".3" stop-color="#E5383B"/>
      <stop offset=".5" stop-color="#8A47C9"/>
      <stop offset=".7" stop-color="#2F6FED"/>
    </linearGradient>
    <linearGradient id="tw-shade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#140a30" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="tw-rim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="tw-gfill" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="55">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#E9E4FF" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="tw-grim" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="55">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <filter id="tw-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="tw-blur2" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="1.1"/></filter>
    <mask id="tw-out" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/><g fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M32 16 L32 38"/><path d="M20.5 31.5 L32 26.5 L43.5 31.5"/><path d="M23 52 L32 38 L41 52"/></g><circle cx="32" cy="15.5" r="6.2" fill="#000"/>
    </mask>
    <mask id="tw-body" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M32 16 L32 38"/><path d="M20.5 31.5 L32 26.5 L43.5 31.5"/><path d="M23 52 L32 38 L41 52"/></g><circle cx="32" cy="15.5" r="6.2" fill="#fff"/></mask>
    <mask id="tw-ring" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M32 16 L32 38"/><path d="M20.5 31.5 L32 26.5 L43.5 31.5"/><path d="M23 52 L32 38 L41 52"/></g><circle cx="32" cy="15.5" r="6.2" fill="#fff"/><g fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M32 16 L32 38"/><path d="M20.5 31.5 L32 26.5 L43.5 31.5"/><path d="M23 52 L32 38 L41 52"/></g><circle cx="32" cy="15.5" r="5.2" fill="#000"/>
    </mask>
    <mask id="tw-ropeout" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/><path d="M2 31.5 H62" stroke="#000" stroke-width="3.3"/>
    </mask>
    <linearGradient id="tw-gold" gradientUnits="userSpaceOnUse" x1="0" y1="29.7" x2="0" y2="33.3">
      <stop offset="0" stop-color="#FFD94F"/><stop offset="1" stop-color="#D88A00"/>
    </linearGradient>
    <linearGradient id="tw-ropehi" gradientUnits="userSpaceOnUse" x1="2" y1="0" x2="62" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 1. tile -->
  <g clip-path="url(#tw-clip)">
    <rect width="64" height="64" fill="url(#tw-hue)"/>
    <rect width="64" height="64" fill="url(#tw-shade)"/>
  </g>
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="13.9" fill="none" stroke="url(#tw-rim)" stroke-width="1.2"/>
  <!-- 2. main glyph shadow -->
  <g clip-path="url(#tw-clip)" mask="url(#tw-out)">
    <g filter="url(#tw-blur)" opacity=".32"><g transform="translate(0 2.5)" fill="none" stroke="#160c33" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M32 16 L32 38"/><path d="M20.5 31.5 L32 26.5 L43.5 31.5"/><path d="M23 52 L32 38 L41 52"/></g><circle transform="translate(0 2.5)" cx="32" cy="15.5" r="6.2" fill="#160c33"/></g>
  </g>
  <!-- 3. main glyph: frosted white glass -->
  <g mask="url(#tw-body)"><rect width="64" height="64" fill="url(#tw-gfill)"/></g>
  <g mask="url(#tw-ring)"><rect width="64" height="64" fill="url(#tw-grim)"/></g>
  <!-- 4. accent (rope) shadow -->
  <g clip-path="url(#tw-clip)" mask="url(#tw-ropeout)" filter="url(#tw-blur2)">
    <path d="M2 33 H62" stroke="#1a1238" stroke-opacity=".35" stroke-width="3.3" stroke-linecap="round"/>
  </g>
  <!-- 5. accent (rope): gold glass -->
  <g clip-path="url(#tw-clip)">
    <path d="M2 31.5 H62" stroke="url(#tw-gold)" stroke-opacity=".94" stroke-width="3.3"/>
    <path d="M2 30.05 H62" stroke="url(#tw-ropehi)" stroke-width=".7"/>
  </g>
</svg>
